<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media and Interactive Elements</title>
</head>
<body>
    <h1>Media and Interactive Elements</h1>
    <h2>Audio</h2>
    <audio controls>
        <source src="wavy.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <br><br>
    <h2>Video</h2>
    <video controls>
        <source src="rohit.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>

    <br><br>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/0fYi1k8g5xM" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
</body>
</html>
