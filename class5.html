<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    
    <table border="1">
        <caption>My Table</caption>
        <thead>
            <tr>
                <th>Sr. No.</th>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Ardhendu Biswas</td>
                <td>20</td>
                <td>Kolkata</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Satyabrata</td>
                <td>25</td>
                <td>Delhi</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4">This is the footer of the table</td>
            </tr>
    </table> 

           

</body>
</html>
